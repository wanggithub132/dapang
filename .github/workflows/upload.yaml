name: download and upload video

on:
  schedule:
    - cron: "0 3,10,13 * * *"
  workflow_dispatch:

env:
  BILI_UP_VER: v0.2.4

jobs:
  main:
    concurrency: download-and-upload
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: "3.12"
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: install dependency
        run: |
          sudo apt-get update
          sudo apt-get install ffmpeg -y
          pip install -r requirements.txt
          wget https://github.com/biliup/biliup-rs/releases/download/$BILI_UP_VER/biliupR-$BILI_UP_VER-x86_64-linux.tar.xz
          tar xvf biliupR-$BILI_UP_VER-x86_64-linux.tar.xz
          sudo mv biliupR-$BILI_UP_VER-x86_64-linux/biliup /usr/local/bin/
          sudo chmod +x /usr/local/bin/biliup
          sudo timedatectl set-timezone "Asia/Shanghai"
      - name: install douyin uploader (social-auto-upload)
        run: |
          git clone --depth 1 https://github.com/dreammis/social-auto-upload.git .sau
          pip install -e .sau
          cp .sau/conf.example.py .sau/conf.py
          sudo patchright install --with-deps chromium
      - name: setup youtube cookies
        run: |
          if [ -n "${{ secrets.YT_COOKIES }}" ]; then
            echo "${{ secrets.YT_COOKIES }}" > cookies.txt
          fi
      - name: main logic
        env:
          GIST_ID: ${{secrets.GIST_ID}}
          GIT_TOKEN: ${{secrets.GIT_TOKEN}}
          GOOGLE_CREDENTIALS: ${{secrets.GOOGLE_CREDENTIALS}}
          DOUYIN_COOKIE_AUTH_HEADLESS: "true"
        run: python upload.py $GIT_TOKEN $GIST_ID
