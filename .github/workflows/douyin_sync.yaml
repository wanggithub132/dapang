name: douyin to bilibili sync

on:
  schedule:
    # 每 3 小时检查一次博主是否有新作品（UTC；B站投稿间隔由脚本内 sleep 控制）
    - cron: "0 */3 * * *"
  workflow_dispatch:
    inputs:
      logLevel:
        description: 日志级别
        type: choice
        default: INFO
        options:
          - INFO
          - DEBUG

env:
  BILI_UP_VER: v0.2.4

jobs:
  sync:
    concurrency: douyin-to-bilibili
    # 抖音的 a_bogus 签名在 Linux + xvfb 下会被判伪造
    # （Blocked by ArgusSecurityPlugin Sign Invalid），
    # 改用 Windows runner 的真实桌面会话，环境与本机已验证成功的 Windows 一致
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: "3.12"
      - name: install dependency
        run: |
          choco install ffmpeg -y --no-progress
          pip install -r requirements.txt
          $url = "https://github.com/biliup/biliup-rs/releases/download/$env:BILI_UP_VER/biliupR-$env:BILI_UP_VER-x86_64-windows.zip"
          Invoke-WebRequest -Uri $url -OutFile biliup.zip
          Expand-Archive biliup.zip -DestinationPath biliupR -Force
          $exe = Get-ChildItem -Path biliupR -Recurse -Filter biliup.exe | Select-Object -First 1
          Add-Content -Path $env:GITHUB_PATH -Value $exe.DirectoryName
          Set-TimeZone -Id "China Standard Time"
      - name: install chromium (patchright)
        run: patchright install chromium
      - name: sync douyin posts
        env:
          GIST_ID: ${{secrets.GIST_ID}}
          GIT_TOKEN: ${{secrets.GIT_TOKEN}}
        run: python douyin_sync.py $env:GIT_TOKEN $env:GIST_ID --logLevel ${{ inputs.logLevel || 'INFO' }}
